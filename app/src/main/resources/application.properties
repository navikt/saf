logging.config=classpath:logback-spring.xml
spring.main.banner_mode=off

# actuators
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
        
graphiql.endpoint=/graphql
server.tomcat.threads.min-spare=50
server.tomcat.threads.max=100
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

aktoer.v2.readtimeoutms=10000
aktoer.v2.connectiontimeoutms=3000
pensjon.v1.readtimeoutms=10000
pensjon.v1.connectiontimeoutms=3000

management.metrics.enable.http.client.requests=false

redis.hostname=saf-redis
redis.port=6379

http.proxy.parametername=notused
