spring.main.banner_mode=off

spring.jackson.deserialization.fail-on-null-for-primitives=false

# actuators
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.endpoints.web.exposure.include=prometheus,health
# actuator - health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

server.compression.enabled=true
server.compression.mime-types=application/json
spring.web.error.include-message=always
server.tomcat.threads.min-spare=50
server.tomcat.threads.max=150
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.http.codecs.max-in-memory-size=512MB
spring.data.redis.password=${valkey.password}

management.metrics.enable.http.client.requests=false

http.proxy.parametername=notused

# circuitbreaker
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.sliding-window-type=count_based
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=15
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.record-exceptions=no.nav.saf.exceptions.SafTechnicalException,\
  org.springframework.web.client.HttpServerErrorException,org.springframework.web.client.ResourceAccessException,\
  java.io.IOException,\
  org.springframework.web.reactive.function.client.WebClientException,org.springframework.core.codec.DecodingException, \
  io.netty.handler.timeout.ReadTimeoutException
resilience4j.circuitbreaker.configs.default.ignore-exceptions=no.nav.saf.exceptions.SafFunctionalException
resilience4j.circuitbreaker.instances.sak.base-config=default
resilience4j.circuitbreaker.instances.pensjonsakrest.base-config=default
resilience4j.circuitbreaker.instances.tilgangsmaskinen.base-config=default
resilience4j.circuitbreaker.instances.tilgangsmaskinen.sliding-window-size=100
resilience4j.circuitbreaker.instances.tilgangsmaskinen.minimum-number-of-calls=75
resilience4j.circuitbreaker.instances.tilgangsmaskinen.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.entra-proxy.base-config=default
resilience4j.circuitbreaker.instances.entra-proxy.sliding-window-size=100
resilience4j.circuitbreaker.instances.entra-proxy.minimum-number-of-calls=75
resilience4j.circuitbreaker.instances.entra-proxy.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.dokarkivhentdokument.base-config=default
resilience4j.circuitbreaker.instances.dokarkivhentdokument.sliding-window-size=50
resilience4j.circuitbreaker.instances.dokarkivhentdokument.minimum-number-of-calls=25
resilience4j.circuitbreaker.instances.dokarkivhentdokument.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.dokarkivhentdokument.wait-duration-in-open-state=5m
resilience4j.circuitbreaker.instances.dokarkivmetadata.base-config=default
resilience4j.circuitbreaker.instances.pdl.base-config=default
resilience4j.circuitbreaker.instances.k9sak.base-config=default
resilience4j.circuitbreaker.instances.fpsak.base-config=default
resilience4j.circuitbreaker.instances.bidragsak.base-config=default
resilience4j.circuitbreaker.instances.navhrorganisasjon.base-config=default
resilience4j.circuitbreaker.instances.naistexas.base-config=default

# retry
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=no.nav.saf.exceptions.SafTechnicalException,org.springframework.web.client.HttpServerErrorException,\
  org.springframework.web.reactive.function.client.WebClientException,org.springframework.web.client.RestClientException,\
  java.io.IOException
resilience4j.retry.configs.default.ignore-exceptions=no.nav.saf.exceptions.SafFunctionalException
resilience4j.retry.instances.sak.base-config=default
resilience4j.retry.instances.pensjonsakrest.base-config=default
resilience4j.retry.instances.tilgangsmaskinen.base-config=default
resilience4j.retry.instances.pdl.base-config=default
resilience4j.retry.instances.dokarkivhentdokument.base-config=default
resilience4j.retry.instances.dokarkivmetadata.base-config=default
resilience4j.retry.instances.naistexas.base-config=default