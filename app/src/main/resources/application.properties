logging.config=classpath:logback-spring.xml
spring.main.banner_mode=off

# actuators
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus
        
graphiql.endpoint=/graphql
server.tomcat.min-spare-threads=50
server.tomcat.max-threads=100

bidrag.sak.url=http://bidrag-sak/bidrag-sak/pip/sak/
hentjournalsakinfo.url=http://dokarkiv/hentjournalsakinfo
aktoer.v2.readtimeoutms=10000
aktoer.v2.connectiontimeoutms=3000
pensjon.v1.readtimeoutms=10000
pensjon.v1.connectiontimeoutms=3000

management.metrics.enable.http.client.requests=false

redis.hostname=saf-redis
redis.port=6379

security.oidc.idp.azurev1.proxyUrl=${HTTP_PROXY}
security.oidc.idp.azurev2.proxyUrl=${HTTP_PROXY}

no.nav.security.jwt.issuer.azurev1.discoveryUrl= ${SECURITY_OIDC_IDP_AZUREV2_ISSUERURL}.well-known/openid-configuration
no.nav.security.jwt.issuer.azurev1.acceptedAudience= c7adbfbb-1b1e-41f6-9b7a-af9627c04998, 38e07d31-659d-4595-939a-f18dce3446c5,

no.nav.security.jwt.issuer.azurev2.discoveryUrl= ${SECURITY_OIDC_IDP_AZUREV2_ISSUERURL}.well-known/openid-configuration
no.nav.security.jwt.issuer.azurev2.acceptedAudience= c7adbfbb-1b1e-41f6-9b7a-af9627c04998, c91c511f-311f-4d56-b7f0-7eda352ce4ae

no.nav.security.jwt.issuer.openam.discoveryUrl=${SECURITY_OIDC_IDP_OPAM_DISCOVERYURL}
no.nav.security.jwt.issuer.openam.acceptedAudience= veilarblogin-${FASIT_ENVIRONMENT_NAME}, gosys-nais-${FASIT_ENVIRONMENT_NAME}, gosys-localhost, gosys-dokument-auth-proxy-${FASIT_ENVIRONMENT_NAME}, eux-helloeu-app-${FASIT_ENVIRONMENT_NAME}

no.nav.security.jwt.issuer.reststs.discoveryUrl=${SECURITY_OIDC_IDP_STS_DISCOVERYURL}
no.nav.security.jwt.issuer.reststs.acceptedAudience= srvdagpenger-joark, srvdokdisteformidl, srvdokdistfordeling 
