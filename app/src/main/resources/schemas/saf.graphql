    FOS,
    # Fullmakt
    FUL,
    # Generell
    GEN,
    # Gravferdsstønad
    GRA,
    # Grunn- og hjelpestønad
    GRU,
    # Helsetjenester og ort. Hjelpemidler
    HEL,
    # Hjelpemidler
    HJE,
    # Inkluderende Arbeidsliv
    IAR,
    # Tiltakspenger
    IND,
    # Klage/Anke
    KLA,
    # Kontakt NAV
    KNA,
    # Kommunale tjenester
    KOM,
    # Kontantstøtte
    KON,
    # Kontroll
    KTR,
    # Lønnsgaranti
    LGA,
    # Medlemskap
    MED,
    # Mob.stønad
    MOB,
    # 3 - Skanning
    MOT,
