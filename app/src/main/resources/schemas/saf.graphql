
scalar Date
scalar DateTime

schema {
    query: Query
}

type Query {
    # Returnerer en liste over alle dokumenter tilknyttet en bruker.
    dokumentoversiktBruker(brukeridentifikator: Brukeridentifikator!, fraDato: Date = null, tema: [Tema], journalposttyper: [Journalposttype] = [], journalstatuser: [Journalstatus] = []): [Journalpost]!
}

type Journalpost {
    journalpostId: String!
    tittel: String
    journalposttype: Journalposttype
    journalstatus: Journalstatus
    tema: Tema
    temanavn: String
    sak: Sak
    avsenderMottakerNavn: String
    journalfortAvNavn: String
    kanal: Kanal
    kanalnavn: String
    relevanteDatoer: [RelevantDato]
    dokumenter: [DokumentInfo]
}

type RelevantDato {
    dato: DateTime
    datotype: Datotype
}

type Sak {
    arkivsaksnummer: String
    arkivsaksystem: Arkivsaksystem
    fagsaknummer: String
    fagsystem: String
    datoOpprettet: DateTime
}

type DokumentInfo {
    dokumentId: String!
    tittel: String
    navSkjemaId: String
    saksbehandlerHarTilgang: Boolean
    dokumentvarianter: [Dokumentvariant]
}

type Dokumentvariant {
    variantformat: Variantformat
}

enum Datotype {
    OPPRETTET_DATO
    EKSPEDERT_DATO
    MOTTATT_DATO
}

input Brukeridentifikator {
    ident: String!
    identType: BrukeridentifikatorType!
}

enum BrukeridentifikatorType {
    # Aktørid
    AKTOERID
    # Fødelsnummer - 11 siffer
    FOEDSELSNUMMER
}

enum Arkivsaksystem {
    GSAK
    PSAK
}

enum Journalposttype {
    # Inngående dokument
	I
	# Utgående dokument
	U
	# Notat
	N
}

enum Journalstatus {
    MOTTATT
    JOURNALFOERT
    FERDIGSTILT
    EKSPEDERT
    UNDER_ARBEID
    FEILREGISTRERT
    UTGAAR
    AVBRUTT
    UKJENT_BRUKER
    RESERVERT
    OPPLASTING_DOKUMENT
}

enum Kanal {
    # Altinn
    ALTINN,
    # Utveksling av trygdeinformasjon mellom EU- og EØS-land
	EESSI,
	# Elektronisk innsending
	EIA,
	# Eksternt oppslag
	EKST_OPPS,
	# Lokal utskrift
	LOKAL_UTSKRIFT,
	# Ditt NAV
	NAV_NO,
	# Selvbetjening Pesys
	PSELV,
	# Sentral utskrift
	SENTRAL_UTSKRIFT,
	# Sikker Digital Post
	SDP,
	# Skanning Nets
	SKAN_NETS,
	# Skanning Pensjon
	SKAN_PEN,
	# Ingen distribusjon
	INGEN_DISTRIBUSJON
}

