image: "docker.adeo.no:5000/dok/saf"
replicas:
  min: 1
  max: 2
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    memory: 512Mi
fasitResources:
  used:
  - alias: sak.saker
    resourceType: restservice
  - alias: OpenIdConnectAgent
    resourceType: credential
    propertyMap:
      password: security.openam.password