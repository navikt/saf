team: teamdokumenthandtering
image: "repo.adeo.no:5443/dok/saf"
replicas:
  min: 2
  max: 4
  cpuThresholdPercentage: 50
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 4000m
    memory: 4096Mi
  requests:
    memory: 20480Mi
fasitResources:
  used:
  - alias: srvsaf
    resourceType: credential
    propertyMap:
      username: SERVICEUSER_USERNAME
      password: SERVICEUSER_PASSWORD
  - alias: "abac.pdp.endpoint"
    resourceType: restservice
  - alias: securityTokenService
    resourceType: baseurl
  - alias: Aktoer_v2
    resourceType: webserviceendpoint
  - alias: serviceGateway
    resourceType: webservicegateway
  - alias: safproperties
    resourceType: applicationproperties