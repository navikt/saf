team: teamdokumenthandtering
image: "repo.adeo.no:5443/dok/saf"
replicas:
  min: 2
  max: 8
  cpuThresholdPercentage: 50
port: 8080
webproxy: true
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
redis:
  enabled: true
  limits:
    memory: 128Mi
  requests:
    memory: 128Mi
prometheus:
  enabled: true
  path: /actuator/prometheus
resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    memory: 1280Mi
fasitResources:
  used:
  - alias: srvsaf
    resourceType: credential
    propertyMap:
      username: SERVICEUSER_USERNAME
      password: SERVICEUSER_PASSWORD
  - alias: "abac.pdp.endpoint"
    resourceType: restservice
  - alias: "HentBrukerOgEnhetstilgangerForSak"
    resourceType: restservice
    propertyMap:
      url: pensjonsakrs.v1.url
  - alias: "sak.saker"
    resourceType: restservice
  - alias: securityTokenService
    resourceType: baseurl
  - alias: "virksomhet:Aktoer_v2"
    resourceType: soapservice
    propertyMap:
      endpointUrl: aktoer.v2.endpointurl
  - alias: "pensjon::PensjonSak_v1"
    resourceType: soapservice
    propertyMap:
      endpointUrl: pensjon.v1.endpointurl
  - alias: safproperties
    resourceType: applicationproperties
  - alias: freg-security-oidc
    resourceType: OpenIdConnect
    propertyMap:
      issuerUrl: security.oidc.idp.openAm.issuerUrl
      jwksUrl: security.oidc.idp.openAm.jwksUrl
  - alias: azure_v1_oidc
    resourceType: OpenIdConnect
    propertyMap:
      issuerUrl: security.oidc.idp.azurev1.issuerUrl
      jwksUrl: security.oidc.idp.azurev1.jwksUrl
  - alias: azure_v2_oidc
    resourceType: OpenIdConnect
    propertyMap:
      issuerUrl: security.oidc.idp.azurev2.issuerUrl
      jwksUrl: security.oidc.idp.azurev2.jwksUrl

  - alias: azure_v1_discovery
    resourceType: BaseUrl
    propertyMap:
      url: security.oidc.idp.azurev1.discoveryUrl
  - alias: azure_v2_discovery
    resourceType: BaseUrl
    propertyMap:
      url: security.oidc.idp.azurev2.discoveryUrl
  - alias: security-token-service-openid-configuration
    resourceType: restservice
    propertyMap:
      url: security.oidc.idp.sts.discoveryUrl
  - alias: opam_oidc_discovery
    resourceType: BaseUrl
    propertyMap:
      url: security.oidc.idp.opam.discoveryUrl

  - alias: security-token-service-issuer
    resourceType: BaseUrl
    propertyMap:
      url: security.oidc.idp.sts.issuerUrl
  - alias: security-token-service-jwks
    resourceType: RestService
    propertyMap:
      url: security.oidc.idp.sts.jwksUrl




  - alias: OpenIdConnect
    resourceType: BaseUrl
  exposed:
    - alias: "saf.graphql"
      resourceType: restservice
      path: /graphql
    - alias: "saf.hentdokument"
      resourceType: restservice
      path: /rest/hentdokument
