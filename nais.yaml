image: "docker.adeo.no:5000/dok/saf"
replicas:
  min: 1
  max: 1
  cpuThresholdPercentage: 70
port: 8080
healthcheck:
  liveness:
    path: /isAlive
    initialDelay: 30
    failureThreshold: 10
  readiness:
    path: /isReady
    initialDelay: 30
    timeout: 3
prometheus:
  enabled: false
resources:
  limits:
    cpu: 2000m